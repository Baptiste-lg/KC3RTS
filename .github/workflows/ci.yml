name: CI

on:
  push:
    branches: [main, audit-gameplay]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Elixir quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1"
          elixir-version: "1.20.0"
      - uses: actions/cache@v4
        with:
          path: server/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('server/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        working-directory: server
        run: mix deps.get
      - name: Check formatting
        working-directory: server
        run: mix format --check-formatted
      - name: Credo
        working-directory: server
        run: mix credo --strict
      - name: Tests
        working-directory: server
        run: mix test

  web:
    name: Browser client quality and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test:coverage
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run build:pages
        working-directory: web

  kc3:
    name: Pinned KC3 rule boundary
    # KC3's Git module requires the libgit2 1.9 development headers.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1"
          elixir-version: "1.20.0"
      - name: Install KC3 build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libtool-bin libffi-dev libbsd-dev libevent-dev libgit2-dev libtls-dev pkg-config ruby
      - name: Build pinned KC3
        run: |
          setup_log=$(mktemp)
          if sh scripts/setup-kc3.sh >"$setup_log" 2>&1; then
            cat "$setup_log"
          else
            details=$(tail -n 40 "$setup_log")
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            printf '::error title=KC3 setup failed::%s\n' "$details"
            cat "$setup_log"
            exit 1
          fi
      - name: Check generated KC3 catalog
        run: sh scripts/export-content.sh --check
      - run: mix deps.get
        working-directory: server
      - name: KC3 integration tests
        working-directory: server
        env:
          KC3RTS_KC3S: ${{ github.workspace }}/.toolchain/kc3/kc3s/kc3s
          LD_LIBRARY_PATH: ${{ github.workspace }}/.toolchain/kc3/libkc3:${{ github.workspace }}/.toolchain/kc3/lib/kc3/0.1
        run: mix test --cover

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Authoritative KC3 browser orders
        working-directory: web
        run: npm run smoke:kc3

  browser:
    name: Browser play loop
    needs: [server, web, kc3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1"
          elixir-version: "1.20.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: server/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('server/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: mix deps.get
        working-directory: server
      - run: npm ci
        working-directory: web
      - run: npm run smoke
        working-directory: web
      - run: npm run smoke:pages
        working-directory: web

  pages:
    name: Publish playable GitHub Pages
    needs: [server, web, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:pages
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
